name: Docker CI/CD

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
        if: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}

      - name: Build Docker image
        run: docker build -t docker/humanize/aman .

      - name: Run Docker container
        run: |
          docker run -d -p 8000:8000 --name test-container docker/humanize/aman
          sleep 10

      - name: Test /health endpoint
        run: |
          curl --fail http://localhost:8000/health

      - name: Push Docker image to DockerHub
        run: |
          docker tag docker/humanize/aman ${{ secrets.DOCKERHUB_USERNAME }}/humanize-aman:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/humanize-aman:latest
        if: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}

      - name: Stop and remove container
        run: |
          docker stop test-container
          docker rm test-container 