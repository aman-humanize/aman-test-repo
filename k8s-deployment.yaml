apiVersion: apps/v1
kind: Deployment
metadata:
  name: humanize-aman
spec:
  replicas: 1
  selector:
    matchLabels:
      app: humanize-aman
  template:
    metadata:
      labels:
        app: humanize-aman
    spec:
      containers:
      - name: humanize-aman
        image: docker/humanize/aman:latest
        ports:
        - containerPort: 8000
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: humanize-aman-service
spec:
  selector:
    app: humanize-aman
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8000
  type: ClusterIP 